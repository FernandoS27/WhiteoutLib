# Build per-platform Python wheels via cibuildwheel + a single sdist.
#
# Triggers:
#   - Push to main: build everything, attach to a draft prerelease.
#   - Tag push (v*): build everything, attach to the matching GitHub release.
#   - Manual dispatch.
#
# Matrix:
#   Linux  x86_64 + aarch64  (manylinux_2_28)
#   macOS  x86_64 + arm64    (deploy target 11.0)
#   Windows x86_64
#   Each × CPython 3.9-3.14
#
# All build configuration lives in pyproject.toml ([tool.cibuildwheel]).

name: wheels

on:
  push:
    branches: [main]
    tags:     ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for upload-release-asset on tag pushes

jobs:
  # ── Source distribution (one job; produces a single tarball) ───────────
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir packages/python/dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz

  # ── Per-platform wheels via cibuildwheel ───────────────────────────────
  wheels:
    name: wheels (${{ matrix.os }} / ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   archs: "x86_64"  }
          - { os: ubuntu-24.04-arm, archs: "aarch64" }
          - { os: macos-13,        archs: "x86_64"  }   # Intel runner
          - { os: macos-14,        archs: "arm64"   }   # Apple Silicon runner
          - { os: windows-latest,  archs: "AMD64"   }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        with:
          output-dir: packages/python/dist
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # Pin to the matrix OS so cibuildwheel doesn't try cross-arch
          # builds via QEMU (slow + flaky); each runner does its native arch.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: packages/python/dist/*.whl

  # ── Aggregate + (optional) publish to GitHub release ──────────────────
  collect:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages/python/dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lah packages/python/dist/

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/python/dist/*
          draft: true
          generate_release_notes: true
