version: 1.0.{build}

# Cross-platform CI: Windows (MSVC), Linux (gcc), macOS (AppleClang),
# plus a dedicated WASM job (emscripten on Ubuntu) that emits a Node.js
# npm package.
#
# Each "native" image emits per-platform packages (Java natives classifier
# jar + Python wheel). The Linux native job additionally emits the universal
# main Java jar — bytecode is platform-independent, so it only needs to be
# built once. The WASM job emits `whiteout-node-<ver>.tgz`.
#
# Each job runs ONE cmake configure + build that produces every artefact
# the job will package (see tools/build-ci.{ps1,sh} + tools/build-ci-wasm.sh).
# Java/Python/npm packaging steps then *consume* those outputs — no second
# C++ compile per language.

configuration:
  - Release

platform:
  - x64

clone_depth: 5

# Job matrix — one entry per actual job. AppVeyor's matrix syntax only
# supports `fast_finish` / `exclude` / `allow_failures` under `matrix:`
# (no `include:`), so heterogeneous job sets are expressed via
# `environment.matrix` with `APPVEYOR_BUILD_WORKER_IMAGE` pinned per entry.
# This pattern avoids the Cartesian product that would result from
# combining a top-level `image:` list with `environment.matrix`.
environment:
  # CMAKE_BUILD_PARALLEL_LEVEL is intentionally NOT set globally — the
  # safe default varies per OS. tools/build-ci.sh defaults to 2 on Linux
  # (OOM-prone: 7 GB RAM, pybind11 wrappers peak ~2 GB each) and 4 on
  # macOS; tools/build-ci.ps1 defaults to 4 on Windows. CI can still
  # override via the env var if a future runner has more RAM.
  # JDK 22+ is required for stable FFM. AppVeyor's Ubuntu/macOS images
  # already ship a recent JDK; Windows uses chocolatey via install step.
  # Brew's stable openjdk formulas are openjdk@25 / @21 / @17 — there is
  # no @22, so pin to @25 (newer LTS with stable FFM).
  JAVA_VERSION: "25"
  # Emscripten version used by the WASM job. Pinning avoids surprise
  # binary-size or codegen changes between emsdk releases.
  EMSDK_VERSION: "3.1.61"

  matrix:
    # Codegen first — produces the autogenerated binding sources once, on
    # one machine, and ships them as a shared artifact. Native jobs poll
    # for this job to finish, download the artifact, and skip their own
    # codegen so every OS compiles byte-identical generated files. WASM
    # doesn't participate — emsdk pulls its own libclang and runs codegen
    # itself.
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      WHITEOUT_TARGET: codegen
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      WHITEOUT_TARGET: wasm
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
      WHITEOUT_TARGET: native
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      WHITEOUT_TARGET: native
    - APPVEYOR_BUILD_WORKER_IMAGE: macos-sonoma
      WHITEOUT_TARGET: native
    # Packaging fan-in — runs last. Polls every native job (windows,
    # linux, macos) for success, downloads their `native-binary` +
    # `python-wheels` + `java-natives` + `java-jars` artifacts, then
    # builds the final consumer-facing packages:
    #   • Whiteout.<version>.nupkg with all three platform binaries
    #     under runtimes/{win-x64,linux-x64,osx-arm64}/native/
    #   • Collated python-wheels-all, java-bundle-all (cosmetic;
    #     individual per-OS artifacts are still available).
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
      WHITEOUT_TARGET: package

# ─── Init ────────────────────────────────────────────────────────────────────
# Windows: AppVeyor's `Visual Studio 2022` image defaults `python` on PATH
# to the 32-bit Python 3.12 (`C:\Python312`). The `libclang` PyPI package
# only ships wheels for 64-bit Windows — on 32-bit Python pip builds from
# sdist, but the sdist doesn't carry `libclang.dll`, so codegen fails with
# "Could not find module 'libclang.dll'". Prepend the 64-bit Python to
# PATH and persist via `appveyor SetVariable` so every subsequent
# `cmd`/`ps`/script step inherits the override.
init:
  - ps: |
      # No-op on non-Windows workers — the Test-Path fails out cleanly.
      $py64 = "C:\Python312-x64"
      if (Test-Path "$py64\python.exe") {
          $env:Path = "$py64;$py64\Scripts;$env:Path"
          appveyor SetVariable -Name Path -Value $env:Path
      }

# ─── Install ────────────────────────────────────────────────────────────────
# AppVeyor images ship CMake + the platform's default C++ toolchain. We also
# need: a JDK 22+, a Python with `pip install pybind11 libclang wheel`, and
# Maven. On Linux, install a newer gcc for full C++20.
install:
  # Pick a JDK >= JAVA_VERSION on the Windows worker. The Visual Studio
  # 2022 image's default `javac` is too old for `--release 22` from
  # bindings/java/pom.xml (and the modular project at
  # bindings/java/src/main/java/module-info.java tells the compiler plugin
  # to pass `--module-version`, which an older JDK rejects as unknown).
  # Look for a pre-installed JDK in C:\Program Files\Java\jdk-NN; fall back
  # to chocolatey if nothing recent enough is staged. Linux/macOS install
  # their JDKs in the `sh:` steps below.
  - ps: |
      if ($env:OS -ne 'Windows_NT') { return }
      $ErrorActionPreference = "Stop"
      $minMajor = [int]$env:JAVA_VERSION
      if ($minMajor -lt 22) { $minMajor = 22 }
      function Find-JDK($root) {
          if (-not (Test-Path $root)) { return @() }
          Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(?:jdk-?|openjdk-?)(\d+)' } |
              ForEach-Object {
                  $major = [int]([regex]::Match($_.Name, '(\d+)').Groups[1].Value)
                  [PSCustomObject]@{ Path = $_.FullName; Major = $major }
              }
      }
      $candidates = @(Find-JDK 'C:\Program Files\Java') +
                    @(Find-JDK 'C:\Program Files\Eclipse Adoptium') +
                    @(Find-JDK 'C:\Program Files\OpenJDK')
      $candidates = $candidates | Where-Object { $_.Major -ge $minMajor } |
          Sort-Object Major -Descending
      if (-not $candidates) {
          Write-Host "No pre-installed JDK >= $minMajor; installing openjdk via chocolatey..."
          $installed = $false
          foreach ($pkg in @("openjdk$minMajor", "openjdk")) {
              & choco install $pkg -y --no-progress 2>&1 | Write-Host
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
          }
          if (-not $installed) { throw "chocolatey install of JDK $minMajor failed" }
          $candidates = @(Find-JDK 'C:\Program Files\OpenJDK') +
                        @(Find-JDK 'C:\Program Files\Eclipse Adoptium') +
                        @(Find-JDK 'C:\Program Files\Java')
          $candidates = $candidates | Where-Object { $_.Major -ge $minMajor } |
              Sort-Object Major -Descending
      }
      if (-not $candidates) { throw "Could not locate JDK >= $minMajor on Windows worker" }
      $jdkHome = $candidates[0].Path
      Write-Host "Using JDK at: $jdkHome (major $($candidates[0].Major))"
      $env:JAVA_HOME = $jdkHome
      $env:Path = "$jdkHome\bin;$env:Path"
      # Persist for subsequent AppVeyor steps (each one spawns a fresh
      # process). The `appveyor SetVariable` CLI isn't on PATH inside pwsh
      # on this image, so use the .NET API to write to the Machine env
      # block directly — AppVeyor's build agent runs as Administrator, so
      # the Machine scope write succeeds and new processes inherit it.
      [Environment]::SetEnvironmentVariable('JAVA_HOME', $jdkHome, 'Machine')
      $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
      [Environment]::SetEnvironmentVariable('Path', "$jdkHome\bin;$machinePath", 'Machine')
      # Don't invoke `java -version` from pwsh — javac/java write to stderr,
      # and Windows PowerShell 5.1 with $ErrorActionPreference=Stop turns
      # any stderr emission from a native command into a terminating error.
      # The next `cmd:` step in install runs `java -version` cleanly.
  - cmd: cmake --version
  - cmd: where python
  - cmd: python --version
  - cmd: java -version
  - cmd: mvn -version
  - cmd: python -m pip install --upgrade pip
  - cmd: python -m pip install pybind11 libclang wheel packaging tomli

  - sh:  cmake --version
  - sh:  |
      # Linux toolchain — newer gcc from ubuntu-toolchain-r/test.
      if [ "$(uname -s)" = "Linux" ]; then
        if command -v apt-get >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          for v in 15 14 13 12; do
            if sudo apt-get install -y --no-install-recommends gcc-$v g++-$v; then
              export CC=gcc-$v
              export CXX=g++-$v
              echo "CC=gcc-$v"  >> linux_cc.env
              echo "CXX=g++-$v" >> linux_cc.env
              break
            fi
          done
          # JDK ≥22 — fall back through newer-then-older versions because
          # Ubuntu 22.04 jammy's main archive only ships up to openjdk-19.
          # The openjdk-r/ppa carries 21/22/23/24/25 from upstream Temurin
          # builds; AppVeyor's image already has it activated on some
          # workers, so we try the package first before pulling the PPA.
          # python3-venv: Debian/Ubuntu strips ensurepip from the system
          # python3 package; without it `python -m venv` fails with
          # "ensurepip is not available". python3.10-venv covers the
          # AppVeyor image's default pyenv-shim'd 3.10.
          # clang: needed for `clang -print-resource-dir` so the codegen's
          # libclang can find stddef.h / stdarg.h. Without it the AST
          # degrades and the generated bindings reference `std::whiteout`.
          # Pin Python 3.12 across every CI worker so the published wheels
          # share a single cp tag (cp312-cp312-{platform}). The 3.12 packages
          # come from deadsnakes/ppa on Ubuntu — install + select before the
          # candidate loop below runs.
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              maven python3-pip python3-venv \
              python3.12 python3.12-venv python3.12-dev \
              clang
          JDK_INSTALLED=""
          for v in 25 24 23 22 ${JAVA_VERSION}; do
            if sudo apt-get install -y --no-install-recommends openjdk-${v}-jdk 2>/dev/null; then
              JDK_INSTALLED="$v"; break
            fi
          done
          if [ -z "$JDK_INSTALLED" ]; then
            sudo add-apt-repository -y ppa:openjdk-r/ppa
            sudo apt-get update -qq
            for v in 25 24 23 22; do
              if sudo apt-get install -y --no-install-recommends openjdk-${v}-jdk 2>/dev/null; then
                JDK_INSTALLED="$v"; break
              fi
            done
          fi
          [ -n "$JDK_INSTALLED" ] || { echo "no JDK >=22 available on apt" >&2; exit 1; }
          echo "installed openjdk-${JDK_INSTALLED}-jdk"
        elif command -v brew >/dev/null; then
          : # macOS path below
        fi
        echo "Using: $(${CXX:-g++} --version | head -n1)"
      fi
  - sh:  |
      # macOS: AppleClang is preinstalled; install JDK + Maven via brew.
      # `brew install` is idempotent — formulas already on the image are
      # left in place. The `|| true` swallows the no-op "already installed".
      if [ "$(uname -s)" = "Darwin" ]; then
        brew update >/dev/null
        # python@3.12 is the pinned CI Python (see build-ci.{ps1,sh} and
        # the Linux install above). Install it explicitly so the candidate
        # loop below picks 3.12 rather than brew's default newer python3.
        brew install --quiet python@3.12 openjdk@${JAVA_VERSION} maven || true
        # openjdk@NN is keg-only; expose its bin/ on PATH so `java`/`javac`
        # resolve to the installed version rather than the image's default.
        JDK_PREFIX="$(brew --prefix openjdk@${JAVA_VERSION} 2>/dev/null || true)"
        if [ -n "$JDK_PREFIX" ] && [ -d "$JDK_PREFIX/bin" ]; then
          export PATH="$JDK_PREFIX/bin:$PATH"
        fi
        echo "PATH=$PATH" >> macos_env.env
        java -version
      fi
  - sh:  |
      # Pin Python 3.12 — wheels must share the cp312-cp312-{platform} tag
      # across all platform jobs so PyPI can serve the right one. Other
      # 3.x are accepted as a fallback but log a warning since the wheel
      # collation step won't be uniform.
      BASE_PY=""
      for cand in python3.12 python3.13 python3.11 python3.10 python3 python; do
        if command -v "$cand" >/dev/null 2>&1 && \
           "$cand" -c 'import sys; sys.exit(0 if sys.version_info >= (3,10) else 1)' 2>/dev/null; then
          BASE_PY="$(command -v "$cand")"; break
        fi
      done
      [ -n "$BASE_PY" ] || { echo "no python >=3.10 on PATH" >&2; exit 1; }
      if ! "$BASE_PY" -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3,12) else 1)' 2>/dev/null; then
          echo "WARNING: picked $BASE_PY which is not Python 3.12 — collated wheels will have mixed cp tags" >&2
      fi
      echo "base python: $BASE_PY ($($BASE_PY --version))"

      # Try to create a venv so pip respects PEP 668 cleanly (brew Python
      # on macOS + Debian/Ubuntu's externally-managed Python both refuse
      # `pip install` into their system site-packages). If venv fails
      # (Debian's python3-venv split, or any other "ensurepip missing"
      # weirdness on AppVeyor's pyenv-shim'd images), fall back to using
      # the base interpreter with a user-site pip bootstrapped via
      # ensurepip — DON'T use the Debian system pip, it's built for
      # Python 3.10 and imports distutils.cmd (removed in 3.12).
      VENV="${APPVEYOR_BUILD_FOLDER}/.ci-venv"
      VENV_ERR="${APPVEYOR_BUILD_FOLDER}/.ci-venv.err"
      PIP_FLAGS=""
      if "$BASE_PY" -m venv "$VENV" 2>"$VENV_ERR" && [ -x "$VENV/bin/python" ] && \
         "$VENV/bin/python" -m pip --version >/dev/null 2>&1; then
        PY="${VENV}/bin/python"
        echo "venv python: $PY"
      else
        echo "venv unavailable; venv stderr was:" >&2
        cat "$VENV_ERR" >&2 || true
        PY="$BASE_PY"
        PIP_FLAGS="--user"
        echo "falling back to base python with --user installs: $PY"
        # Bootstrap a modern pip into the user site. Python 3.12's user
        # site (`~/.local/lib/python3.12/site-packages`) appears in
        # sys.path BEFORE `/usr/lib/python3/dist-packages`, so the
        # bundled-wheel pip from ensurepip shadows the broken Debian one.
        "$PY" -m ensurepip --upgrade --user
        export PATH="$HOME/.local/bin:$PATH"
      fi
      echo "export CI_PYTHON=$PY" > "${APPVEYOR_BUILD_FOLDER}/ci_python.env"

      "$PY" -m pip install $PIP_FLAGS --upgrade pip
      "$PY" -m pip install $PIP_FLAGS pybind11 libclang wheel packaging tomli

# ─── Configure + build (unified) ────────────────────────────────────────────
# One cmake build per job produces the C++ static lib, the Java FFM native,
# and the Python pybind11 module. tools/build-ci.{ps1,sh} encapsulates
# codegen + configure + build so the appveyor.yml stays readable.
#
# NOTE: the build invocation lives in `build_script:` (not `before_build:`).
# Setting `build: off` would skip the ENTIRE build phase including
# before_build and after_build — silently passing every job. Putting the
# real command in build_script keeps the lifecycle wired up.
build_script:
  - cmd: powershell -ExecutionPolicy Bypass -File tools\build-ci.ps1
  - sh:  |
      if [ -f linux_cc.env ];   then set -a; . ./linux_cc.env;   set +a; fi
      if [ -f macos_env.env ];  then set -a; . ./macos_env.env;  set +a; fi
      if [ -f ci_python.env ];  then set -a; . ./ci_python.env;  set +a; fi
      bash tools/build-ci.sh

# Native-job after_build (Java natives jar + Python wheel + Linux-only
# universal main jar) lives inside the per-target `for:` block below.
# Keeping it at the root would run on wasm/codegen/package too — AppVeyor's
# `after_build: []` in those `for:` blocks doesn't reliably override the
# root list, so we follow the same pattern as `before_build`: define it
# only on the targets that need it.

# ─── Artifacts ──────────────────────────────────────────────────────────────
# Native jobs only upload intermediates consumed by the package job:
#   * native-binary  — the raw whiteout_native.{dll,so,dylib}
#   * python-wheels  — the per-platform cp312 wheel
# The universal Java jar, the NuGet, and the collated wheel bundle are
# produced once in the package job's build_script and uploaded from there.
artifacts:
  - path: packages/python/dist/*.whl
    name: python-wheels
  - path: build-ci/c-dist/**/whiteout_native.dll
    name: native-binary
  # Recursive globs on Linux / macOS too — single-config generators normally
  # place the lib directly under c-dist/, but if the generator changes (or
  # a future CMake INSTALL step adds a per-config subdir) the non-recursive
  # path silently misses it and the package job aborts on a missing-binary
  # error far downstream. Recursive is harmless for the direct-placement case.
  - path: build-ci/c-dist/**/libwhiteout_native.so
    name: native-binary
  - path: build-ci/c-dist/**/libwhiteout_native.dylib
    name: native-binary

test: off

# Stop the matrix wave on the first failed job so a single platform problem
# doesn't burn the others' minutes.
matrix:
  fast_finish: true

# ─── Per-target overrides ───────────────────────────────────────────────────
# Each `for:` block fully overrides the matching keys from the root config
# for jobs whose `matrix.only` entries match. The native block adds the
# codegen-artifact poll/fetch step; the codegen/wasm/package blocks replace
# install + build steps for their own one-off flows.

for:

# ─── Native job overrides ───────────────────────────────────────────────────
# Native jobs (Windows / Linux / macOS) consume the codegen artifact rather
# than running their own codegen. Poll the codegen job until it succeeds,
# download `codegen-sources.tar.gz`, extract it over the working tree, and
# set `WHITEOUT_SKIP_CODEGEN=1` so tools/build-ci.{ps1,sh} reuse the exact
# generated files. Only native targets get a before_build — the codegen,
# wasm, and package jobs each have their own (or `before_build: []`).
  - matrix:
      only:
        - WHITEOUT_TARGET: native

    before_build:
      - ps: |
          # `ps:` runs on Windows AND on macOS/Linux (via pwsh). The
          # poll-and-extract logic uses Windows-only commands (`tar.exe`),
          # so short-circuit on non-Windows — the `sh:` step below
          # covers Linux/macOS. `$env:OS == 'Windows_NT'` is set by
          # Windows for both PowerShell 5.1 and PowerShell Core; on
          # macOS/Linux it's unset.
          if ($env:OS -ne 'Windows_NT') { return }
          $ErrorActionPreference = "Stop"
          $apiBase = "https://ci.appveyor.com/api/projects/${env:APPVEYOR_ACCOUNT_NAME}/${env:APPVEYOR_PROJECT_SLUG}/build/${env:APPVEYOR_BUILD_VERSION}"
          Write-Host "Polling $apiBase for codegen job..."
          $deadline = (Get-Date).AddMinutes(30)
          $codegenJobId = $null
          $terminalFailure = $false
          while ((Get-Date) -lt $deadline) {
              try {
                  $resp = Invoke-RestMethod -Uri $apiBase -ErrorAction Stop
                  $job = $resp.build.jobs | Where-Object { $_.name -match 'codegen' } | Select-Object -First 1
                  if ($job) {
                      if ($job.status -eq "success")   { $codegenJobId = $job.jobId; break }
                      if ($job.status -eq "failed" -or $job.status -eq "cancelled") {
                          Write-Host "codegen job ended '$($job.status)' — aborting"
                          $terminalFailure = $true
                          break
                      }
                  }
              } catch {
                  Write-Host "poll error (will retry): $_"
              }
              Start-Sleep -Seconds 20
          }
          if ($terminalFailure) { throw "codegen job did not succeed" }
          if (-not $codegenJobId) { throw "codegen job did not finish in time" }
          Write-Host "codegen job ready: $codegenJobId"

          $listing = Invoke-RestMethod -Uri "https://ci.appveyor.com/api/buildjobs/$codegenJobId/artifacts"
          $tarball = $listing | Where-Object { $_.fileName -match 'codegen-sources\.tar\.gz$' } | Select-Object -First 1
          if (-not $tarball) { throw "codegen artifact not found on job $codegenJobId" }

          $dest = Join-Path $env:APPVEYOR_BUILD_FOLDER "codegen-sources.tar.gz"
          Invoke-WebRequest -Uri "https://ci.appveyor.com/api/buildjobs/$codegenJobId/artifacts/$($tarball.fileName)" -OutFile $dest
          Write-Host "downloaded $dest"

          # Windows ships bsdtar as `tar.exe` in System32 — extracts .tar.gz natively.
          & tar.exe -xzf $dest -C $env:APPVEYOR_BUILD_FOLDER
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed" }
          Write-Host "extracted codegen sources"

          # Sentinel file picked up by tools/build-ci.ps1. AppVeyor's
          # `appveyor SetVariable` CLI isn't on PATH in pwsh on Windows,
          # so cross-step env var persistence via the CLI is unreliable —
          # a file-system marker survives the step boundary cleanly.
          New-Item -ItemType File -Force `
              -Path (Join-Path $env:APPVEYOR_BUILD_FOLDER ".codegen-done") | Out-Null

      - sh: |
          set -euo pipefail
          # macOS workers don't ship jq; Ubuntu usually does but check
          # both. Installed here rather than in `install:` because only
          # this step needs it.
          if ! command -v jq >/dev/null 2>&1; then
              if command -v brew >/dev/null; then
                  brew install --quiet jq
              elif command -v apt-get >/dev/null; then
                  sudo apt-get install -y --no-install-recommends jq
              else
                  echo "jq not available and no package manager to install it" >&2; exit 1
              fi
          fi
          api_base="https://ci.appveyor.com/api/projects/${APPVEYOR_ACCOUNT_NAME}/${APPVEYOR_PROJECT_SLUG}/build/${APPVEYOR_BUILD_VERSION}"
          echo "Polling ${api_base} for codegen job..."
          deadline=$(( $(date +%s) + 1800 ))
          codegen_jobid=""
          while [ "$(date +%s)" -lt "${deadline}" ]; do
              resp="$(curl -fsS "${api_base}" || true)"
              if [ -n "${resp}" ]; then
                  info="$(echo "${resp}" | jq -r '.build.jobs[] | select(.name | contains("codegen")) | .jobId + " " + .status' | head -n1)"
                  jobid="$(echo "${info}" | cut -d' ' -f1)"
                  status="$(echo "${info}" | cut -d' ' -f2)"
                  if [ "${status}" = "success" ]; then
                      codegen_jobid="${jobid}"; break
                  elif [ "${status}" = "failed" ] || [ "${status}" = "cancelled" ]; then
                      echo "codegen job ended '${status}' — aborting" >&2; exit 1
                  fi
              fi
              sleep 20
          done
          [ -n "${codegen_jobid}" ] || { echo "codegen job did not finish in time" >&2; exit 1; }
          echo "codegen job ready: ${codegen_jobid}"

          listing="$(curl -fsS "https://ci.appveyor.com/api/buildjobs/${codegen_jobid}/artifacts")"
          fname="$(echo "${listing}" | jq -r '.[] | select(.fileName | endswith("codegen-sources.tar.gz")) | .fileName' | head -n1)"
          [ -n "${fname}" ] || { echo "codegen artifact not found on job ${codegen_jobid}" >&2; exit 1; }
          curl -fsSL "https://ci.appveyor.com/api/buildjobs/${codegen_jobid}/artifacts/${fname}" \
              -o "${APPVEYOR_BUILD_FOLDER}/codegen-sources.tar.gz"
          tar -xzf "${APPVEYOR_BUILD_FOLDER}/codegen-sources.tar.gz" -C "${APPVEYOR_BUILD_FOLDER}"
          echo "extracted codegen sources"

          # Sentinel file picked up by tools/build-ci.sh — mirrors the
          # Windows poller. See build-ci.{ps1,sh} for the matching check.
          : > "${APPVEYOR_BUILD_FOLDER}/.codegen-done"

    # Native-only packaging. The native jobs produce ONE per-platform
    # output that the package job consumes: a Python wheel. The Java
    # universal jar is built once in the package job (it embeds all three
    # platform binaries via runtime classpath extraction); no per-platform
    # `mvn -P natives` here. The raw native binary is already uploaded
    # via the root `artifacts:` rule for the package job to pick up.
    after_build:
      # Windows: pack the wheel, then verify the native DLL + wheel both
      # exist before the artifact-upload phase. AppVeyor's `appveyor
      # PushArtifact` silently no-ops on glob mismatches, so a missing
      # binary doesn't fail the job — but it ALWAYS breaks the package
      # job downstream. Fail loud here with a directory dump so the
      # culprit is easy to spot.
      - cmd: python tools\pack_python_wheel.py --build-dir build-ci --out-dir packages\python\dist
      - ps: |
          # Skip on non-Windows (this ps: step runs on every platform via
          # pwsh; macOS/Linux are handled by the sh: block below).
          if ($env:OS -ne 'Windows_NT') { return }
          $ErrorActionPreference = 'Stop'
          $missing = @()
          $dll = Get-ChildItem -Path build-ci\c-dist -Recurse -Filter whiteout_native.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { $missing += 'whiteout_native.dll' }
          $whl = Get-ChildItem -Path packages\python\dist -Filter *.whl -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $whl) { $missing += '*.whl' }
          if ($missing.Count -gt 0) {
              Write-Host "MISSING ARTIFACTS: $($missing -join ', ')"
              Write-Host "--- build-ci\c-dist listing ---"
              if (Test-Path build-ci\c-dist) {
                  Get-ChildItem -Path build-ci\c-dist -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
              } else {
                  Write-Host "(no build-ci\c-dist directory)"
              }
              Write-Host "--- packages\python\dist listing ---"
              if (Test-Path packages\python\dist) {
                  Get-ChildItem -Path packages\python\dist -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
              } else {
                  Write-Host "(no packages\python\dist directory)"
              }
              throw "Required artifacts missing"
          }
      - sh: |
          set -e
          if [ -f ci_python.env ]; then set -a; . ./ci_python.env; set +a; fi
          PY="${CI_PYTHON:-$(command -v python3 || command -v python)}"
          "$PY" tools/pack_python_wheel.py \
              --build-dir build-ci \
              --out-dir   packages/python/dist
          # Same fail-loud check as the Windows path: AppVeyor's artifact
          # upload silently no-ops on glob mismatches, so verify both
          # outputs exist while we can still surface a usable error.
          case "$(uname -s)" in
              Darwin) native_lib="libwhiteout_native.dylib" ;;
              *)      native_lib="libwhiteout_native.so"    ;;
          esac
          missing=""
          if ! find build-ci/c-dist -name "${native_lib}" 2>/dev/null | grep -q .; then
              missing="${missing} ${native_lib}"
          fi
          if ! find packages/python/dist -name '*.whl' 2>/dev/null | grep -q .; then
              missing="${missing} *.whl"
          fi
          if [ -n "${missing}" ]; then
              echo "MISSING ARTIFACTS:${missing}" >&2
              echo "--- build-ci/c-dist listing ---"
              find build-ci/c-dist -mindepth 1 2>/dev/null | head -50 || true
              echo "--- packages/python/dist listing ---"
              find packages/python/dist -mindepth 1 2>/dev/null | head -50 || true
              exit 1
          fi

# ─── Codegen job overrides ──────────────────────────────────────────────────
# A lightweight Linux job that runs the Python codegen once, packages the
# generated source/header files into a tarball, and ships it as an
# artifact (`codegen-sources.tar.gz`). The native jobs (Windows, Linux,
# macOS) poll for this job to finish, then download + extract the
# tarball, then build with `WHITEOUT_SKIP_CODEGEN=1` so they reuse the
# exact same generated sources.
  - matrix:
      only:
        - WHITEOUT_TARGET: codegen

    install:
      - sh: |
          set -e
          sudo apt-get update -qq
          # codegen needs: python3 + libclang (Python wrapper + native DLL),
          # clang (for `clang -print-resource-dir` so libclang finds
          # stddef.h/stdarg.h), tar.
          sudo apt-get install -y --no-install-recommends \
              python3-pip python3-venv python3.10-venv clang
          # AppVeyor's Ubuntu 22.04 image puts pyenv shims for several
          # Python versions on PATH, but only one is "global"-selected.
          # The unselected shims print `pyenv: <ver>: command not found`
          # and exit non-zero. `command -v` happily resolves them, so
          # iterate + actually invoke each candidate; pick the first
          # whose `-c 'import sys; ...'` returns 0.
          BASE_PY=""
          for cand in python3.13 python3.12 python3.11 python3.10 python3 python; do
              if command -v "$cand" >/dev/null 2>&1 && \
                 "$cand" -c 'import sys; sys.exit(0 if sys.version_info >= (3,10) else 1)' 2>/dev/null; then
                  BASE_PY="$(command -v "$cand")"; break
              fi
          done
          [ -n "${BASE_PY}" ] || { echo "no python >=3.10 on PATH" >&2; exit 1; }
          echo "base python: ${BASE_PY} ($(${BASE_PY} --version))"

          VENV="${APPVEYOR_BUILD_FOLDER}/.ci-venv"
          VENV_ERR="${APPVEYOR_BUILD_FOLDER}/.ci-venv.err"
          PIP_FLAGS=""
          if "$BASE_PY" -m venv "$VENV" 2>"$VENV_ERR" && [ -x "$VENV/bin/python" ] && \
             "$VENV/bin/python" -m pip --version >/dev/null 2>&1; then
              PY="${VENV}/bin/python"
          else
              echo "venv unavailable; venv stderr was:" >&2
              cat "$VENV_ERR" >&2 || true
              PY="$BASE_PY"
              PIP_FLAGS="--user"
              # See native job: ensurepip bypasses the broken Debian
              # python3-pip when Python 3.12 is in use.
              "$PY" -m ensurepip --upgrade --user
              export PATH="$HOME/.local/bin:$PATH"
          fi
          echo "export CI_PYTHON=$PY" > "${APPVEYOR_BUILD_FOLDER}/ci_python.env"
          "$PY" -m pip install $PIP_FLAGS --upgrade pip
          "$PY" -m pip install $PIP_FLAGS libclang packaging tomli

    # Codegen-only — no native compile, no before_build poll.
    before_build: []

    build_script:
      - sh: |
          set -euo pipefail
          if [ -f ci_python.env ]; then set -a; . ./ci_python.env; set +a; fi
          PY="${CI_PYTHON}"
          export PYTHONIOENCODING=utf-8

          modules=(textures mdx m2 m3 utils host mpq casc)

          # C ABI (consumed by Java FFM and C# P/Invoke).
          "$PY" -m tools.codegen.codegen textures --backend c-common-header
          "$PY" -m tools.codegen.codegen textures --backend c-common
          for mod in "${modules[@]}"; do
              for backend in c-header c-source; do
                  "$PY" -m tools.codegen.codegen "${mod}" --backend "${backend}"
              done
          done

          # Java FFM.
          "$PY" -m tools.codegen.codegen textures --backend java-common
          for mod in "${modules[@]}"; do
              "$PY" -m tools.codegen.codegen "${mod}" --backend java
          done

          # Python pybind11 + .pyi stubs.
          for mod in "${modules[@]}"; do
              "$PY" -m tools.codegen.codegen "${mod}" --backend pybind11
              "$PY" -m tools.codegen.codegen "${mod}" --backend pyi
          done

          # C#.
          for mod in "${modules[@]}"; do
              "$PY" -m tools.codegen.codegen "${mod}" --backend csharp
          done

    after_build:
      - sh: |
          # Bundle every codegen output into a single tarball that native
          # jobs untar over their working tree. Paths are kept relative
          # to the repo root so the extracted layout overlays cleanly.
          # `--exclude` skips files that share the `whiteout_*` prefix
          # but are actually hand-written (the C# trampoline shim).
          tar -czf codegen-sources.tar.gz \
              --exclude='whiteout_csharp_shims.cpp' \
              bindings/c/whiteout_*.h \
              bindings/c/whiteout_*.cpp \
              bindings/java/src/main/java \
              bindings/python/*_bindings.cpp \
              bindings/csharp/Whiteout \
              packages/python/whiteout-stubs

    artifacts:
      - path: codegen-sources.tar.gz
        name: codegen-sources

# ─── WASM job overrides ─────────────────────────────────────────────────────
# When WHITEOUT_TARGET=wasm, replace the native build's install / build /
# after_build / artifacts with the emscripten + npm-pack flow. `for:` blocks
# fully override the matching keys from the root config (the rest, like
# clone_depth and branches, still apply). WASM doesn't consume the codegen
# artifact — emsdk pulls its own libclang and the Embind backend is
# different from the C/Java/Python ones.
  - matrix:
      only:
        - WHITEOUT_TARGET: wasm

    # WASM runs its own codegen via the Embind backend in
    # tools/build-ci-wasm.sh — no need to poll for the codegen job's
    # artifact (it doesn't ship Embind output).
    before_build: []

    install:
      - sh: |
          set -e
          # System deps: cmake, ninja, python, node — Ubuntu2204 ships node
          # 18 but a newer one is fine; cmake/ninja need installing.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              cmake ninja-build python3-pip nodejs npm
          python3 -m pip install --upgrade pip
          python3 -m pip install libclang
      - sh: |
          # Install + activate emsdk at the pinned version.
          if [ ! -d "${HOME}/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${HOME}/emsdk"
          fi
          cd "${HOME}/emsdk"
          ./emsdk install "${EMSDK_VERSION}"
          ./emsdk activate "${EMSDK_VERSION}"
          # Stash the activation env so build_script can re-source it (each
          # AppVeyor script step runs in a fresh shell).
          echo "source ${HOME}/emsdk/emsdk_env.sh" > "${APPVEYOR_BUILD_FOLDER}/emsdk.env"

    build_script:
      - sh: |
          set -e
          # Re-activate emsdk (build_script runs in a fresh shell from install).
          source "${APPVEYOR_BUILD_FOLDER}/emsdk.env"
          # Absolute path: the install step's last `cd` to ~/emsdk doesn't
          # persist across `sh:` blocks, but AppVeyor sets CWD to something
          # other than APPVEYOR_BUILD_FOLDER on this image — guard with the
          # absolute path so it works regardless.
          bash "${APPVEYOR_BUILD_FOLDER}/tools/build-ci-wasm.sh"

    # No after_build — npm pack runs inside build-ci-wasm.sh.
    after_build: []

    artifacts:
      - path: packages/js-node/*.tgz
        name: wasm-node-package
      - path: packages/js-node/whiteout-node.wasm
        name: wasm-node-binary
      - path: packages/js-ts/*.tgz
        name: wasm-web-package
      - path: packages/js-ts/whiteout.wasm
        name: wasm-web-binary

# ─── Package job overrides ──────────────────────────────────────────────────
# Fans in artifacts from the three native jobs (windows, ubuntu, macos)
# and produces the final consumer-facing packages.
  - matrix:
      only:
        - WHITEOUT_TARGET: package

    install:
      - sh: |
          set -e
          sudo apt-get update -qq
          # jq: parse AppVeyor REST responses. unzip: jar introspection.
          # dotnet 8: dotnet pack the C# NuGet. maven + a JDK ≥22: build
          # the universal Java jar. python3.12 + build module: produce the
          # platform-independent Python sdist for unsupported targets.
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              jq unzip curl maven \
              python3.12 python3.12-venv python3.12-dev
          # Bootstrap a modern pip via ensurepip. Ubuntu's python3-pip
          # ships into /usr/lib/python3/dist-packages (a version-agnostic
          # path) built against Python 3.10 stdlib — it imports
          # `distutils.cmd`, which was removed in Python 3.12. ensurepip
          # installs the pip wheel bundled with python3.12-venv into the
          # user site, which appears earlier in sys.path than the broken
          # Debian copy.
          python3.12 -m ensurepip --upgrade --user
          export PATH="$HOME/.local/bin:$PATH"
          python3.12 -m pip install --user --upgrade pip
          python3.12 -m pip install --user build
          # JDK — same fall-through as the root install for native jobs.
          JDK_INSTALLED=""
          for v in 25 24 23 22; do
            if sudo apt-get install -y --no-install-recommends openjdk-${v}-jdk 2>/dev/null; then
              JDK_INSTALLED="$v"; break
            fi
          done
          if [ -z "$JDK_INSTALLED" ]; then
            sudo add-apt-repository -y ppa:openjdk-r/ppa
            sudo apt-get update -qq
            for v in 25 24 23 22; do
              if sudo apt-get install -y --no-install-recommends openjdk-${v}-jdk 2>/dev/null; then
                JDK_INSTALLED="$v"; break
              fi
            done
          fi
          [ -n "$JDK_INSTALLED" ] || { echo "no JDK >=22 for package job" >&2; exit 1; }
          # Microsoft's official .NET 8 install script (idempotent).
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel 8.0 --install-dir "${HOME}/.dotnet"
          echo "export PATH=${HOME}/.dotnet:\$PATH" > "${APPVEYOR_BUILD_FOLDER}/dotnet.env"
          "${HOME}/.dotnet/dotnet" --version

    # The package job doesn't need its own codegen — it polls the native
    # jobs (which already consumed the codegen artifact) and uses the
    # already-generated bindings/csharp/Whiteout/ from the codegen
    # tarball it downloads here too.
    before_build:
      - sh: |
          set -euo pipefail
          if [ -f "${APPVEYOR_BUILD_FOLDER}/dotnet.env" ]; then
              set -a; . "${APPVEYOR_BUILD_FOLDER}/dotnet.env"; set +a
          fi
          api_base="https://ci.appveyor.com/api/projects/${APPVEYOR_ACCOUNT_NAME}/${APPVEYOR_PROJECT_SLUG}/build/${APPVEYOR_BUILD_VERSION}"
          mkdir -p "${APPVEYOR_BUILD_FOLDER}/_dl"

          # Match each prerequisite job by two substrings that both must
          # appear in the AppVeyor-generated job name. AppVeyor composes
          # names like "Image: <image>; Configuration: ...; <env vars>";
          # order-independent AND-logic is safer than a regex.
          # (substr_1|substr_2 — empty second means single-substring match.)
          declare -A want=(
              [codegen]='codegen|'
              [windows]='Visual Studio 2022|native'
              [linux]='Ubuntu2204|native'
              [macos]='macos-sonoma|native'
          )

          echo "Polling ${api_base} for native + codegen jobs..."
          deadline=$(( $(date +%s) + 3600 ))   # 1h budget for the longest native job
          declare -A jobs_ready jobs_id
          while [ "$(date +%s)" -lt "${deadline}" ]; do
              resp="$(curl -fsS "${api_base}" || true)"
              if [ -n "${resp}" ]; then
                  all_done=true
                  for key in "${!want[@]}"; do
                      [ -n "${jobs_ready[$key]:-}" ] && continue
                      IFS='|' read -r p1 p2 <<< "${want[$key]}"
                      if [ -n "${p2}" ]; then
                          filter='.build.jobs[] | select((.name | contains($p1)) and (.name | contains($p2))) | .jobId + " " + .status'
                          info="$(echo "${resp}" | jq -r --arg p1 "${p1}" --arg p2 "${p2}" "${filter}" | head -n1)"
                      else
                          filter='.build.jobs[] | select(.name | contains($p1)) | .jobId + " " + .status'
                          info="$(echo "${resp}" | jq -r --arg p1 "${p1}" "${filter}" | head -n1)"
                      fi
                      jobid="$(echo "${info}" | cut -d' ' -f1)"
                      status="$(echo "${info}" | cut -d' ' -f2)"
                      if [ "${status}" = "success" ]; then
                          jobs_ready[$key]=1
                          jobs_id[$key]="${jobid}"
                          echo "  ${key} job ready (${jobid})"
                      elif [ "${status}" = "failed" ] || [ "${status}" = "cancelled" ]; then
                          echo "  ${key} job ended '${status}' — aborting" >&2; exit 1
                      else
                          all_done=false
                      fi
                  done
                  ${all_done} && break
              fi
              sleep 30
          done
          for key in "${!want[@]}"; do
              [ -n "${jobs_ready[$key]:-}" ] || { echo "${key} job did not finish in time" >&2; exit 1; }
          done

          # Download every artifact we need. AppVeyor's artifact URL is
          # /api/buildjobs/<jobId>/artifacts/<file_path>; the artifact's
          # full path (under name+filename) is in the jobs's `artifacts`
          # listing. We use the listing to discover filenames.
          for key in "${!jobs_id[@]}"; do
              jid="${jobs_id[$key]}"
              echo "Listing artifacts for ${key} (${jid})..."
              listing="$(curl -fsS "https://ci.appveyor.com/api/buildjobs/${jid}/artifacts" || true)"
              echo "${listing}" | jq -r '.[] | .fileName' | while IFS= read -r fname; do
                  [ -z "${fname}" ] && continue
                  out="${APPVEYOR_BUILD_FOLDER}/_dl/${key}__$(basename "${fname}")"
                  echo "  → ${fname}"
                  curl -fsSL "https://ci.appveyor.com/api/buildjobs/${jid}/artifacts/${fname}" -o "${out}"
              done
          done

          # Codegen tarball → restore bindings/csharp/Whiteout/ so we can
          # build the managed assembly. (We don't ship the codegen
          # tarball as a top-level package artifact; it's a build input.)
          tar -xzf "${APPVEYOR_BUILD_FOLDER}/_dl/codegen__codegen-sources.tar.gz" \
              -C "${APPVEYOR_BUILD_FOLDER}"

    build_script:
      - sh: |
          set -euo pipefail
          if [ -f "${APPVEYOR_BUILD_FOLDER}/dotnet.env" ]; then
              set -a; . "${APPVEYOR_BUILD_FOLDER}/dotnet.env"; set +a
          fi
          dl="${APPVEYOR_BUILD_FOLDER}/_dl"

          # ── C# NuGet ─────────────────────────────────────────────────
          # Stage each platform's native binary under runtimes/<rid>/native/.
          # Names of the downloaded files: <jobkey>__<basename>. Fail loud
          # if any binary is missing — a NuGet with a missing platform
          # silently breaks consumers on that platform.
          native_root="${APPVEYOR_BUILD_FOLDER}/packages/csharp/runtimes"
          mkdir -p "${native_root}/win-x64/native" \
                   "${native_root}/linux-x64/native" \
                   "${native_root}/osx-arm64/native"
          required=(
              "windows__whiteout_native.dll:win-x64/native/whiteout_native.dll"
              "linux__libwhiteout_native.so:linux-x64/native/libwhiteout_native.so"
              "macos__libwhiteout_native.dylib:osx-arm64/native/libwhiteout_native.dylib"
          )
          for spec in "${required[@]}"; do
              src="${dl}/${spec%%:*}"
              dst="${native_root}/${spec#*:}"
              if [ ! -f "${src}" ]; then
                  echo "missing native binary: ${src}" >&2; exit 1
              fi
              cp "${src}" "${dst}"
          done

          dotnet pack "${APPVEYOR_BUILD_FOLDER}/bindings/csharp/Whiteout/Whiteout.csproj" \
              --configuration Release \
              --output "${APPVEYOR_BUILD_FOLDER}/packages/csharp"

          # ── Python: collate wheels + build sdist ───────────────────────
          mkdir -p "${APPVEYOR_BUILD_FOLDER}/packages/python/dist"
          # AppVeyor's "name" prefix on the artifact creates a directory
          # in the listing — fileName is like "python-wheels/whiteout-...whl".
          # `cp ${dl}/*whiteout*.whl` would skip these because of the
          # prefix; use find to pull anything wheel-shaped.
          find "${dl}" -name '*.whl' -exec cp {} "${APPVEYOR_BUILD_FOLDER}/packages/python/dist/" \;

          # Source distribution for consumers on platforms we don't ship a
          # binary wheel for (FreeBSD, linux-arm64, etc.). pip falls back
          # to the sdist when no matching wheel exists and builds from
          # source. The codegen tarball was already extracted in
          # before_build, so the pre-generated *_bindings.cpp / *.pyi
          # files are in the source tree — consumers don't need libclang
          # to rebuild them.
          (cd "${APPVEYOR_BUILD_FOLDER}" && \
              python3.12 -m build --sdist --outdir packages/python/dist .)

          # ── Java: universal jar with all 3 platform natives embedded ───
          # Stage each downloaded native binary under
          # bindings/java/src/main/resources/native/<rid>/ so Maven picks
          # it up as a resource; NativeBinaryResolver.java extracts the
          # matching one at runtime via Class.getResourceAsStream.
          res_root="${APPVEYOR_BUILD_FOLDER}/bindings/java/src/main/resources/native"
          mkdir -p "${res_root}/win-x64" "${res_root}/linux-x64" "${res_root}/osx-arm64"
          required=(
              "windows__whiteout_native.dll:win-x64/whiteout_native.dll"
              "linux__libwhiteout_native.so:linux-x64/libwhiteout_native.so"
              "macos__libwhiteout_native.dylib:osx-arm64/libwhiteout_native.dylib"
          )
          for spec in "${required[@]}"; do
              src="${dl}/${spec%%:*}"
              dst="${res_root}/${spec#*:}"
              [ -f "${src}" ] || { echo "missing native binary: ${src}" >&2; exit 1; }
              cp "${src}" "${dst}"
          done
          mvn -f "${APPVEYOR_BUILD_FOLDER}/bindings/java/pom.xml" package -DskipTests
          # The fat jar is bindings/java/target/whiteout-<ver>.jar. Stage
          # alongside the wheels/nupkg under packages/ for the artifact glob.
          mkdir -p "${APPVEYOR_BUILD_FOLDER}/packages/java"
          cp "${APPVEYOR_BUILD_FOLDER}"/bindings/java/target/whiteout-*.jar \
              "${APPVEYOR_BUILD_FOLDER}/packages/java/"

          echo "── package summary ──"
          ls -la "${APPVEYOR_BUILD_FOLDER}/packages/csharp/"*.nupkg || true
          ls -la "${APPVEYOR_BUILD_FOLDER}/packages/python/dist/"   || true
          ls -la "${APPVEYOR_BUILD_FOLDER}/packages/java/"          || true

    after_build: []

    artifacts:
      - path: packages/csharp/*.nupkg
        name: nuget-package
      # Single bundle: the three cp312 platform wheels + the source sdist
      # (whiteout-<ver>.tar.gz) that pip uses for unsupported platforms.
      - path: packages/python/dist/*.whl
        name: python-wheels-all
      - path: packages/python/dist/*.tar.gz
        name: python-wheels-all
      - path: packages/java/*.jar
        name: java-bundle-all

# Build on pushes to any branch + on PRs.
branches:
  except:
    - gh-pages

# Skip CI when only docs or non-build files changed.
skip_commits:
  files:
    - docs/*
    - README.md
    - LICENSE
    - THIRD-PARTY-NOTICES.md
    - .gitignore
    - .clang-tidy
