[package]
name         = "whiteout"
description  = "Parsers and writers for Blizzard model and texture formats (MDX, M2, M3, BLP, DDS, PNG)."
keywords     = ["wow", "warcraft", "starcraft", "mdx", "blp"]
categories   = ["game-development", "parser-implementations"]
readme       = "README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = []
# Mirror the CMake options. Enabling one here without the matching
# WHITEOUT_ENABLE_* in the linked library is a link error, by design.
casc = []
mpq  = []

[dependencies]

[dev-dependencies]
