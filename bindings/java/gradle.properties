# SPDX-License-Identifier: BSD-3-Clause
# Project metadata. Override on the command line with `-Pwhiteout.version=...`.

# Versioning — keep in sync with the other language packages.
group       = io.github.sahmkow
artifactId  = whiteout
version     = 0.1.0

# Where the native library was produced by `scripts/build-java.ps1`
# (or a manual cmake invocation). Override with `-PnativeLibPath=...` to
# point at a custom build directory, or unset to skip the natives JAR.
nativeLibPath = ../../build-java/c-dist/Release/whiteout_native.dll

# Maven coordinates for the natives classifier — `{os}-{arch}` is filled
# in at build time from OS detection. Override with `-PnativeClassifier`
# to force a different value (useful when cross-publishing).
# Leave commented out for auto-detect.
# nativeClassifier = windows-x86_64

# Required toolchain. FFM is stable from JDK 22; JDK 24+ recommended to
# avoid restricted-method warnings.
javaToolchainVersion = 22

# Make Gradle quiet about its incubating features.
org.gradle.warning.mode = none
